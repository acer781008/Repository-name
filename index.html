<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>歡樂多人遊戲大廳</title>
<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  min-height:100%;
}
body{
  overflow-x:hidden;
  background:#22aeea;
}
.stage{
  position:relative;
  width:100vw;
  line-height:0;
  overflow:hidden;
}
.stage img{
  display:block;
  width:100vw;
  height:auto;
}

/* 六張卡片點擊區：維持原本比例位置 */
.hot{
  position:absolute;
  display:block;
  width:22.7%;
  height:31.5%;
  cursor:pointer;
  border-radius:9%;
  outline:none;
  -webkit-tap-highlight-color:transparent;
}
.hot:hover,.hot:focus,.hot:active{outline:none;box-shadow:none}
.c1{left:14.7%;top:23.4%}
.c2{left:38.6%;top:23.4%}
.c3{left:62.4%;top:23.4%}
.c4{left:14.7%;top:60.4%}
.c5{left:38.6%;top:60.4%}
.c6{left:62.4%;top:60.4%;cursor:default}

/* 手機直向：圖片本身拉到至少一個螢幕高，消除下方大片空白。
   不使用第二張背景圖，所以不會重複城堡/熊貓/卡片。 */
@media (max-aspect-ratio: 3/4){
  .stage{
    min-height:100vh;
  }
  .stage img{
    width:100vw;
    min-height:100vh;
    object-fit:fill;
  }
}
</style>
</head>
<body>
<div class="stage">
  <img src="assets/遊戲大廳.png" alt="歡樂多人遊戲大廳">
  <a class="hot c1" href="https://bingo-game1.onrender.com/" aria-label="賓果賓果"></a>
  <a class="hot c2" href="https://dice-guess-king.onrender.com/" aria-label="數字大亂鬥"></a>
  <a class="hot c3" href="https://multiplayer-sudoku-race.onrender.com/" aria-label="數獨競速王"></a>
  <a class="hot c4" href="https://card-hall.onrender.com/" aria-label="多人棋牌館"></a>
  <a class="hot c5" href="https://extreme-quiz-king.onrender.com/" aria-label="極速答題王"></a>
  <span class="hot c6" aria-label="更多遊戲"></span>
</div>
</body>
</html>
