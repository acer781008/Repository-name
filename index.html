<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>歡樂多人遊戲大廳</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:#63cdf4}
body{font-family:"Microsoft JhengHei",Arial,sans-serif}
.stage{width:100%;display:flex;justify-content:center;align-items:flex-start;overflow:hidden}
.board{position:relative;width:min(100vw,1402px);aspect-ratio:1402/1122;background:#63cdf4}
.board>img{display:block;width:100%;height:100%;object-fit:contain}
.hot{position:absolute;display:block;outline:0;border:0;-webkit-tap-highlight-color:transparent;background:transparent}
.hot:focus,.hot:hover,.hot:active{outline:0;box-shadow:none}
.disabled{pointer-events:none}

/* 依新圖六張卡片重新對準 */
.h1{left:10.8%;top:26.6%;width:24.0%;height:32.5%}
.h2{left:36.3%;top:26.6%;width:24.0%;height:32.5%}
.h3{left:62.0%;top:26.6%;width:24.0%;height:32.5%}
.h4{left:10.8%;top:61.2%;width:24.0%;height:31.5%}
.h5{left:36.3%;top:61.2%;width:24.0%;height:31.5%}
.h6{left:62.0%;top:61.2%;width:24.0%;height:31.5%}

@media (max-width:700px){
  html,body{background:#63cdf4}
  .stage{overflow-x:hidden}
  .board{width:100vw;min-width:100vw}
}
</style>
</head>
<body>
<main class="stage">
  <div class="board">
    <img src="assets/遊戲大廳.png" alt="歡樂多人遊戲大廳">
    <a class="hot h1" href="https://bingo-game1.onrender.com/" aria-label="賓果賓果"></a>
    <a class="hot h2" href="https://dice-guess-king.onrender.com/" aria-label="數字大亂鬥"></a>
    <a class="hot h3" href="https://multiplayer-sudoku-race.onrender.com/" aria-label="數獨競速王"></a>
    <a class="hot h4" href="https://card-hall.onrender.com/" aria-label="多人棋牌館"></a>
    <a class="hot h5" href="https://extreme-quiz-king.onrender.com/" aria-label="極速答題王"></a>
    <span class="hot h6 disabled" aria-label="更多遊戲，敬請期待"></span>
  </div>
</main>
</body>
</html>
