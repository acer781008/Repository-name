<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>歡樂多人遊戲大廳</title>
<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  min-height:100%;
}
html{
  background:#39b9ee;
}
body{
  min-height:100vh;
  overflow-x:hidden;
  /* 只用顏色延伸空間，不再放第二張圖片 */
  background:linear-gradient(to bottom,#39b9ee 0%,#b9edff 42%,#ffe6a8 72%,#f7c96f 100%);
}
.stage{
  position:relative;
  width:100%;
  margin:0 auto;
  line-height:0;
}
.stage>img{
  display:block;
  width:100%;
  height:auto;
}

/* 六張卡片點擊區 */
.hot{
  position:absolute;
  display:block;
  width:22.7%;
  height:31.5%;
  cursor:pointer;
  border:0;
  outline:none;
  box-shadow:none;
  border-radius:9%;
  -webkit-tap-highlight-color:transparent;
}
.hot:hover,.hot:active,.hot:focus{
  outline:none;
  box-shadow:none;
}
.c1{left:14.7%;top:23.4%}
.c2{left:38.6%;top:23.4%}
.c3{left:62.4%;top:23.4%}
.c4{left:14.7%;top:60.4%}
.c5{left:38.6%;top:60.4%}
.c6{left:62.4%;top:60.4%;cursor:default}

/* 電腦寬螢幕：圖片永遠完整依比例，不拉伸、不重複。
   左右若因螢幕比例產生空間，只顯示同色系背景。 */
@media (min-width:900px){
  .stage{
    width:min(100vw, calc(100vh * 4 / 3));
  }
}

/* 手機：以手機寬度完整顯示主圖，絕不硬拉高。
   圖片下方剩餘螢幕由同色系背景自然延伸。 */
@media (max-width:899px){
  .stage{width:100vw}
}
</style>
</head>
<body>
<div class="stage">
  <img src="assets/遊戲大廳.png" alt="歡樂多人遊戲大廳">
  <a class="hot c1" href="https://bingo-game1.onrender.com/" aria-label="賓果賓果"></a>
  <a class="hot c2" href="https://dice-guess-king.onrender.com/" aria-label="數字大亂鬥"></a>
  <a class="hot c3" href="https://multiplayer-sudoku-race.onrender.com/" aria-label="數獨競速王"></a>
  <a class="hot c4" href="https://card-hall.onrender.com/" aria-label="多人棋牌館"></a>
  <a class="hot c5" href="https://extreme-quiz-king.onrender.com/" aria-label="極速答題王"></a>
  <span class="hot c6" aria-label="更多遊戲"></span>
</div>
</body>
</html>
