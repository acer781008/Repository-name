<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>歡樂多人遊戲大廳</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#79cef2;font-family:"Microsoft JhengHei",system-ui,sans-serif}
body{overflow-x:hidden}
.stage{
  position:relative;
  width:min(100vw,941px);
  aspect-ratio:941/1672;
  margin:0 auto;
  overflow:hidden;
  background:#79cef2;
}

/* 手機瀏覽器的可視區有時會比原圖比例稍高。
   讓舞台至少填滿可視高度，背景用 cover 自然補滿，
   不再露出底部色條，也不硬拉伸圖片。 */
@media (max-width:941px){
  .stage{
    width:100vw;
    height:max(calc(100vw * 1672 / 941), 100svh);
    aspect-ratio:auto;
  }
}
.bg{
  position:absolute;inset:0;
  width:100%;height:100%;
  object-fit:cover;
  object-position:center top;
  display:block;
}
.cards{
  position:absolute;
  left:5.5%; right:5.5%; bottom:7.2%;
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:1.2vw 1.8vw;
  z-index:2;
}
.card{
  display:block;
  min-width:0;
  border-radius:18px;
  overflow:hidden;
  text-decoration:none;
  -webkit-tap-highlight-color:transparent;
  transition:transform .12s ease;
}
.card img{
  display:block;
  width:100%;
  height:auto;
}
.card:active{transform:scale(.975)}
.card.disabled{pointer-events:none}
@media (min-width:942px){
  .cards{gap:12px 18px}
}
</style>
</head>
<body>
<main class="stage">
  <img class="bg" src="assets/lobby-bg.png" alt="">
  <section class="cards" aria-label="遊戲選單">
    <a class="card" href="https://bingo-game1.onrender.com/"><img src="assets/bingo.png" alt="賓果賓果"></a>
    <a class="card" href="https://dice-guess-king.onrender.com/"><img src="assets/number.png" alt="數字大亂鬥"></a>
    <a class="card" href="https://multiplayer-sudoku-race.onrender.com/"><img src="assets/sudoku.png" alt="數獨競速王"></a>
    <a class="card" href="https://card-hall.onrender.com/"><img src="assets/cards.png" alt="多人棋牌館"></a>
    <a class="card" href="https://extreme-quiz-king.onrender.com/"><img src="assets/quiz.png" alt="極速答題王"></a>
    <span class="card disabled"><img src="assets/more.png" alt="更多遊戲，敬請期待"></span>
  </section>
</main>
</body>
</html>
